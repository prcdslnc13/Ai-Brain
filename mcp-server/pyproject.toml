[project]
name = "brain-mcp"
version = "0.1.0"
description = "MCP server exposing the Ai-Brain Obsidian vault as memory tools"
requires-python = ">=3.11"
dependencies = [
    # mcp 2.0 removed the decorator API (@server.list_tools/@server.call_tool)
    # from the low-level Server; server.py is written against 1.x. Porting is a
    # separate change — keep the range pinned until then.
    "mcp>=1.0.0,<2",
    # No 7.x exists yet; cap the major so a rebuild can't jump to one.
    "pyyaml>=6.0,<7",
    # fastembed is 0.x — minor bumps are breaking. embed.py's offline-first
    # model load is written against 0.8 behavior (no `local_files_only` knob,
    # `cache_dir` kwarg, hub round-trip on every TextEmbedding construction).
    "fastembed>=0.3.0,<0.9",
    # Only basic array ops are used (frombuffer/vstack/linalg.norm/argsort),
    # stable across 1.x and 2.x — cap the major so a rebuild can't jump to 3.
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
# Install with: .venv/bin/pip install -e '.[dev]'  -- no: see CLAUDE.md, never
# editable. Use: .venv/bin/pip install '.[dev]' from the mcp-server directory,
# or just `pip install "pytest>=8,<9"` into the existing venv.
dev = ["pytest>=8,<9"]

[project.scripts]
brain = "brain_mcp.cli:main"
brain-mcp = "brain_mcp.__main__:main"
brain-prep = "brain_mcp.brain_prep:main"
brain-compact = "brain_mcp.compact:main"
brain-doctor = "brain_mcp.doctor:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# tests/ is deliberately excluded from the wheel: it imports from the source tree
# (conftest puts mcp-server/ and hooks/ on sys.path) and asserts against installer
# scripts that only exist in the repo, so a packaged copy could never run.
include = ["brain_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import brain_mcp from the *source* tree, not site-packages. The package is
# installed non-editable (see CLAUDE.md), so without this a test run would silently
# grade the last-installed copy instead of the working tree — which is exactly how
# a 2026-08-24 session spent an hour debugging a fix that was never under test.
pythonpath = [".", "../hooks"]
filterwarnings = ["error::DeprecationWarning:brain_mcp.*"]
